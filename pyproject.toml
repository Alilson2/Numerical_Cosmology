[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "union21-mcmc"
version = "0.1.0"
description = "Cosmological analysis of Union2.1 supernova data"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib"
]

[tool.setuptools]
packages = ["union21_mcmc"]
